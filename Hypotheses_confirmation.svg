<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-label="Hypotheses confirmation chart">
  <rect width="860" height="520" fill="#fbfbfd"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Проверка гипотез</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Оценка подтверждения по итогам кодировки, шкала 0-5.</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <line x1="160" y1="95" x2="160" y2="430" stroke="#d1d5db"/>
    <line x1="280" y1="95" x2="280" y2="430" stroke="#e5e7eb"/>
    <line x1="400" y1="95" x2="400" y2="430" stroke="#e5e7eb"/>
    <line x1="520" y1="95" x2="520" y2="430" stroke="#e5e7eb"/>
    <line x1="640" y1="95" x2="640" y2="430" stroke="#e5e7eb"/>
    <line x1="760" y1="95" x2="760" y2="430" stroke="#d1d5db"/>
    <text x="156" y="452">0</text>
    <text x="276" y="452">1</text>
    <text x="396" y="452">2</text>
    <text x="516" y="452">3</text>
    <text x="636" y="452">4</text>
    <text x="756" y="452">5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <text x="40" y="125">H1 западные без поиска</text>
    <rect x="160" y="108" width="360" height="24" rx="4" fill="#60a5fa"/>
    <text x="530" y="126" font-weight="700">3.0</text>

    <text x="40" y="175">H2 русскоязычные</text>
    <rect x="160" y="158" width="480" height="24" rx="4" fill="#22c55e"/>
    <text x="650" y="176" font-weight="700">4.0</text>

    <text x="40" y="225">H3 поиск и западный нарратив</text>
    <rect x="160" y="208" width="240" height="24" rx="4" fill="#f59e0b"/>
    <text x="410" y="226" font-weight="700">2.0</text>

    <text x="40" y="275">H4 повторы</text>
    <rect x="160" y="258" width="120" height="24" rx="4" fill="#f97316"/>
    <text x="290" y="276" font-weight="700">1.0</text>

    <text x="40" y="325">H5 культурный bias</text>
    <rect x="160" y="308" width="420" height="24" rx="4" fill="#a78bfa"/>
    <text x="590" y="326" font-weight="700">3.5</text>

    <text x="40" y="375">H6 DeepSeek</text>
    <rect x="160" y="358" width="480" height="24" rx="4" fill="#22c55e"/>
    <text x="650" y="376" font-weight="700">4.0</text>
  </g>

  <text x="40" y="490" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Три прогона Grok показали одинаковый профиль: причинная рамка стабильнее конкретных формулировок.</text>
</svg>
