<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-label="Доля регионов в источниках каждой модели">
  <rect width="980" height="720" fill="#fbfbfd"/>
  <text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Какую долю источников каждого региона назвала модель</text>
