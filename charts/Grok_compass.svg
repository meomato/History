  <text x="201" y="264" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Grok 4.3 Fast</text>
  <text x="40" y="492" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Итог: сильный акцент на внутреннем кризисе и заметная роль решений Горбачева и элит.</text>
