<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" role="img" aria-label="Оценка подтверждения шести гипотез">
  <rect width="980" height="610" fill="#fbfbfd"/>
  <text x="42" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Проверка гипотез</text>
  <text x="42" y="68" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Степень подтверждения наблюдаемыми данными, шкала 0-5</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <line x1="330" y1="94" x2="330" y2="424" stroke="#d1d5db"/>
    <line x1="446" y1="94" x2="446" y2="424" stroke="#e5e7eb"/>
    <line x1="562" y1="94" x2="562" y2="424" stroke="#e5e7eb"/>
    <line x1="678" y1="94" x2="678" y2="424" stroke="#e5e7eb"/>
    <line x1="794" y1="94" x2="794" y2="424" stroke="#e5e7eb"/>
    <line x1="910" y1="94" x2="910" y2="424" stroke="#d1d5db"/>
    <text x="326" y="446">0</text>
    <text x="442" y="446">1</text>
    <text x="558" y="446">2</text>
    <text x="674" y="446">3</text>
    <text x="790" y="446">4</text>
    <text x="906" y="446">5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <text x="42" y="123" font-weight="700">H1</text>
    <text x="78" y="123">Западные модели без поиска</text>
    <rect x="330" y="106" width="232" height="24" rx="4" fill="#60a5fa"/>
    <text x="573" y="124" font-weight="700">2.0</text>

    <text x="42" y="173" font-weight="700">H2</text>
    <text x="78" y="173">Русскоязычные модели</text>
    <rect x="330" y="156" width="464" height="24" rx="4" fill="#22c55e"/>
    <text x="805" y="174" font-weight="700">4.0</text>

    <text x="42" y="223" font-weight="700">H3</text>
    <text x="78" y="223">Эффект поиска</text>
    <rect x="330" y="206" width="174" height="24" rx="4" fill="#f59e0b"/>
    <text x="515" y="224" font-weight="700">1.5</text>

    <text x="42" y="273" font-weight="700">H4</text>
    <text x="78" y="273">Вариативность повторов</text>
    <rect x="330" y="256" width="116" height="24" rx="4" fill="#f97316"/>
    <text x="457" y="274" font-weight="700">1.0</text>

    <text x="42" y="323" font-weight="700">H5</text>
    <text x="78" y="323">Культурный раскол</text>
    <rect x="330" y="306" width="348" height="24" rx="4" fill="#a78bfa"/>
    <text x="689" y="324" font-weight="700">3.0</text>

    <text x="42" y="373" font-weight="700">H6</text>
    <text x="78" y="373">Нейтральность DeepSeek</text>
    <rect x="330" y="356" width="464" height="24" rx="4" fill="#22c55e"/>
    <text x="805" y="374" font-weight="700">4.0</text>
  </g>

  <line x1="42" y1="474" x2="938" y2="474" stroke="#e5e7eb"/>
  <text x="42" y="504" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Как читать результат</text>
  <g font-family="Arial, sans-serif" font-size="12.5" fill="#4b5563">
    <text x="42" y="530">H1 и H3 снижены: «честность» модели не наблюдается напрямую, а содержательный эффект поиска оказался слабым.</text>
    <text x="42" y="552">H2 и H6 поддерживаются сильнее; H5 подтвержден частично: различия видны прежде всего в источниках и риторике.</text>
    <text x="42" y="574">H4 проверен только тремя повторами Grok: причинная рамка оказалась устойчивой, но обобщение пока ограничено.</text>
  </g>
</svg>
