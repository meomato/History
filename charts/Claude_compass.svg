<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590" role="img" aria-label="Компас моделей Claude">
  <rect width="820" height="590" fill="#fbfbfd"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Claude: внутрисемейная устойчивость</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Haiku 4.5, Sonnet 4.6 и Opus 4.8 · стандартный режим · без поиска</text>
  <rect x="120" y="92" width="420" height="420" fill="#fff" stroke="#d1d5db"/>
  <line x1="120" y1="302" x2="540" y2="302" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="330" y1="92" x2="330" y2="512" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#eef2f7">
    <line x1="162" y1="92" x2="162" y2="512"/><line x1="204" y1="92" x2="204" y2="512"/>
    <line x1="246" y1="92" x2="246" y2="512"/><line x1="288" y1="92" x2="288" y2="512"/>
    <line x1="372" y1="92" x2="372" y2="512"/><line x1="414" y1="92" x2="414" y2="512"/>
    <line x1="456" y1="92" x2="456" y2="512"/><line x1="498" y1="92" x2="498" y2="512"/>
    <line x1="120" y1="134" x2="540" y2="134"/><line x1="120" y1="176" x2="540" y2="176"/>
    <line x1="120" y1="218" x2="540" y2="218"/><line x1="120" y1="260" x2="540" y2="260"/>
    <line x1="120" y1="344" x2="540" y2="344"/><line x1="120" y1="386" x2="540" y2="386"/>
    <line x1="120" y1="428" x2="540" y2="428"/><line x1="120" y1="470" x2="540" y2="470"/>
  </g>
  <text x="116" y="535" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">внутренние причины</text>
  <text x="438" y="535" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">внешнее давление</text>
  <text x="548" y="100" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">ошибки / случайность</text>
  <text x="548" y="510" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">неизбежность</text>

  <circle cx="191.4" cy="268.4" r="13" fill="#14b8a6" fill-opacity=".35" stroke="#0f766e" stroke-width="2"/>
  <circle cx="191.4" cy="268.4" r="8" fill="#0f766e" stroke="#fff" stroke-width="2"/>
  <text x="210" y="252" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Haiku и Sonnet</text>
  <circle cx="191.4" cy="272.6" r="6" fill="#5eead4" stroke="#0f766e" stroke-width="2"/>
  <text x="210" y="283" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Opus</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <text x="600" y="135" font-weight="700">Средние</text>
    <text x="600" y="164">Haiku: X −3.3 · Y 0.8</text>
    <text x="600" y="190">Sonnet: X −3.3 · Y 0.8</text>
    <text x="600" y="216">Opus: X −3.3 · Y 0.7</text>
  </g>
  <text x="40" y="565" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Разница масштаба модели изменила глубину аргументации, но почти не изменила историческую позицию.</text>
</svg>
