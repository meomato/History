<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="Gemini compass chart">
  <rect width="760" height="560" fill="#fbfbfd"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Gemini: историко-интерпретационный компас</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">X: внутренние причины - внешнее давление. Y: неизбежность - роль решений и ошибок.</text>

  <rect x="120" y="92" width="420" height="420" fill="#ffffff" stroke="#d1d5db"/>
  <line x1="120" y1="302" x2="540" y2="302" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="330" y1="92" x2="330" y2="512" stroke="#9ca3af" stroke-width="1.5"/>
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="162" y1="92" x2="162" y2="512"/><line x1="204" y1="92" x2="204" y2="512"/>
    <line x1="246" y1="92" x2="246" y2="512"/><line x1="288" y1="92" x2="288" y2="512"/>
    <line x1="372" y1="92" x2="372" y2="512"/><line x1="414" y1="92" x2="414" y2="512"/>
    <line x1="456" y1="92" x2="456" y2="512"/><line x1="498" y1="92" x2="498" y2="512"/>
    <line x1="120" y1="134" x2="540" y2="134"/><line x1="120" y1="176" x2="540" y2="176"/>
    <line x1="120" y1="218" x2="540" y2="218"/><line x1="120" y1="260" x2="540" y2="260"/>
    <line x1="120" y1="344" x2="540" y2="344"/><line x1="120" y1="386" x2="540" y2="386"/>
    <line x1="120" y1="428" x2="540" y2="428"/><line x1="120" y1="470" x2="540" y2="470"/>
  </g>

  <text x="116" y="535" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">внутренние причины</text>
  <text x="438" y="535" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">внешнее давление</text>
  <text x="548" y="100" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">ошибки / случайность</text>
  <text x="548" y="510" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">неизбежность</text>

  <circle cx="199.8" cy="247.4" r="8" fill="#2563eb" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <circle cx="199.8" cy="247.4" r="13" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="183" cy="264.2" r="8" fill="#f59e0b" fill-opacity="0.86" stroke="#ffffff" stroke-width="2"/>
  <circle cx="183" cy="264.2" r="13" fill="none" stroke="#dc2626" stroke-width="3"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <rect x="570" y="120" width="16" height="16" fill="#2563eb"/><text x="596" y="133">Flash 3.5 стандарт</text>
    <rect x="570" y="150" width="16" height="16" fill="none" stroke="#16a34a" stroke-width="3"/><text x="596" y="163">Flash 3.5 расшир.</text>
    <rect x="570" y="180" width="16" height="16" fill="#f59e0b"/><text x="596" y="193">Flash Lite стандарт</text>
    <rect x="570" y="210" width="16" height="16" fill="none" stroke="#dc2626" stroke-width="3"/><text x="596" y="223">Flash Lite расшир.</text>
  </g>

  <text x="40" y="492" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Итог: все бесплатные серии Gemini лежат в зоне внутренних причин; Flash Lite чуть сильнее уходит к системной рамке.</text>
</svg>
