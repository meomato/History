    <polygon points="320,216 426.1,235.5 366.6,334.1 248.1,369 165.9,219.9" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="320,216 426.1,235.5 364.4,331.2 250.2,366.1 165.9,219.9" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="320,226.8 419.3,237.7 356,319.5 250.2,366.1 169.4,221.1" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="320,226.8 419.3,237.7 356,319.5 250.2,366.1 169.4,221.1" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 4"/>

    <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
