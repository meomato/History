  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <rect x="522" y="112" width="16" height="16" fill="#2563eb"/><text x="548" y="125">Flash 3.5 стандарт</text>
    <rect x="522" y="142" width="16" height="16" fill="#16a34a"/><text x="548" y="155">Flash 3.5 расшир.</text>
    <rect x="522" y="172" width="16" height="16" fill="#f59e0b"/><text x="548" y="185">Flash Lite стандарт</text>
    <rect x="522" y="202" width="16" height="16" fill="#dc2626"/><text x="548" y="215">Flash Lite расшир.</text>
  </g>

  <text x="40" y="560" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Flash Lite в обоих режимах дает более сухую и внутренне-структурную рамку, чем Flash 3.5.</text>
