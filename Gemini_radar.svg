      <polygon points="320,162 431.3,233.9 383.6,357.4 218,357.4 208.7,233.9"/>
      <polygon points="320,126 465.6,222.8 404.8,386.5 184,386.5 174.4,222.8"/>
      <polygon points="320,90 500,211.7 426,415.6 150,415.6 140,211.7"/>
    </g>
    <g stroke="#d1d5db" stroke-width="1">
      <line x1="320" y1="270" x2="320" y2="90"/>
      <line x1="320" y1="270" x2="500" y2="211.7"/>
      <line x1="320" y1="270" x2="426" y2="415.6"/>
      <line x1="320" y1="270" x2="150" y2="415.6"/>
      <line x1="320" y1="270" x2="140" y2="211.7"/>
