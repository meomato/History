<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540">
  <rect width="760" height="540" fill="#fbfbf8"/>
  <text x="380" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222">ChatGPT 5.5: политический / историко-интерпретационный компас</text>
  <text x="380" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">X: внутренние причины ← → внешнее давление</text>
  <text x="28" y="250" transform="rotate(-90 28 250)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">Y: неизбежность ← → ошибки людей / случайность</text>

  <rect x="120" y="50" width="420" height="420" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <line x1="330" y1="50" x2="330" y2="470" stroke="#777" stroke-width="1.2"/>
  <line x1="120" y1="260" x2="540" y2="260" stroke="#777" stroke-width="1.2"/>

  <g stroke="#e4e4dd" stroke-width="1">
    <line x1="162" y1="50" x2="162" y2="470"/>
    <line x1="204" y1="50" x2="204" y2="470"/>
    <line x1="246" y1="50" x2="246" y2="470"/>
    <line x1="288" y1="50" x2="288" y2="470"/>
    <line x1="372" y1="50" x2="372" y2="470"/>
    <line x1="414" y1="50" x2="414" y2="470"/>
    <line x1="456" y1="50" x2="456" y2="470"/>
    <line x1="498" y1="50" x2="498" y2="470"/>
    <line x1="120" y1="92" x2="540" y2="92"/>
    <line x1="120" y1="134" x2="540" y2="134"/>
    <line x1="120" y1="176" x2="540" y2="176"/>
    <line x1="120" y1="218" x2="540" y2="218"/>
    <line x1="120" y1="302" x2="540" y2="302"/>
    <line x1="120" y1="344" x2="540" y2="344"/>
    <line x1="120" y1="386" x2="540" y2="386"/>
    <line x1="120" y1="428" x2="540" y2="428"/>
  </g>

  <text x="124" y="68" font-family="Arial, sans-serif" font-size="12" fill="#777">ошибки людей / случайность</text>
  <text x="124" y="464" font-family="Arial, sans-serif" font-size="12" fill="#777">неизбежность</text>
  <text x="124" y="254" font-family="Arial, sans-serif" font-size="12" fill="#777">внутренние причины</text>
  <text x="420" y="254" font-family="Arial, sans-serif" font-size="12" fill="#777">внешнее давление</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#555">
    <text x="120" y="488" text-anchor="middle">-5</text>
    <text x="330" y="488" text-anchor="middle">0</text>
    <text x="540" y="488" text-anchor="middle">+5</text>
    <text x="105" y="470" text-anchor="end">-5</text>
    <text x="105" y="264" text-anchor="end">0</text>
    <text x="105" y="54" text-anchor="end">+5</text>
  </g>

  <circle cx="183.0" cy="255.8" r="8" fill="#2f80ed"/>
  <circle cx="187.2" cy="251.6" r="8" fill="#27ae60"/>
  <circle cx="187.2" cy="239.0" r="8" fill="#f2994a"/>
  <circle cx="178.8" cy="239.0" r="8" fill="#9b51e0"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#222">
    <text x="556" y="92" font-weight="700">Серии</text>
    <circle cx="562" cy="116" r="6" fill="#2f80ed"/><text x="576" y="121">Instant + без поиска: X=-3.5, Y=0.1</text>
    <circle cx="562" cy="142" r="6" fill="#27ae60"/><text x="576" y="147">Thinking + без поиска: X=-3.4, Y=0.2</text>
    <circle cx="562" cy="168" r="6" fill="#f2994a"/><text x="576" y="173">Instant + с поиском: X=-3.4, Y=0.5</text>
    <circle cx="562" cy="194" r="6" fill="#9b51e0"/><text x="576" y="199">Thinking + с поиском: X=-3.6, Y=0.5</text>
  </g>

  <text x="380" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#777">Все серии заметно смещены к внутренним причинам; поиск и Thinking почти не меняют позицию.</text>
